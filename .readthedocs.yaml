# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Every push to a tracked branch and every pull request triggers a build, so
# the hosted docs follow the code without anyone publishing them by hand.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  # Treat warnings as errors: a docstring that stops parsing, or a cross
  # reference to something that no longer exists, fails the build instead of
  # quietly producing a page with a hole in it.
  fail_on_warning: true

formats:
  - htmlzip
  - pdf

python:
  install:
    # Docs toolchain only. The solver's own dependencies are mocked in
    # docs/conf.py, so torch and friends are never downloaded here.
    - requirements: docs/requirements.txt
