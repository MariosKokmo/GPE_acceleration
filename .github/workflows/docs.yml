name: Documentation

# Read the Docs already rebuilds the hosted site on every push. This job is the
# gate in front of it: it builds with warnings promoted to errors, so a
# docstring that stops parsing or a cross-reference to something that no longer
# exists fails the pull request instead of silently producing a page with a
# hole in it.
on:
  push:
    branches: [master, main, LLM_updates]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs (warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the docs toolchain
        # Deliberately not the solver's own dependencies: docs/conf.py mocks
        # torch, OpenCV, pandas, matplotlib and the Qt bindings, so the build
        # needs none of them and finishes in seconds.
        run: python -m pip install --upgrade pip -r docs/requirements.txt

      - name: Build
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Check external links
        # Informational only — a third-party site being down should not fail a
        # pull request that has nothing to do with it.
        continue-on-error: true
        run: python -m sphinx -b linkcheck docs docs/_build/linkcheck

      - name: Upload the rendered site
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html
          retention-days: 14
